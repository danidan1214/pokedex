server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para HTML, JS, CSS y SVG
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Los assets con hash (js, css, imágenes) son inmutables: caché agresiva
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Favicon y otros archivos estáticos de la raíz
    location ~* \.(svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html nunca se cachea para que nuevas versiones se sirvan siempre
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Fallback de SPA: cualquier ruta desconocida sirve el index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}